spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/jobhuntbuddy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

jwt.secret=${JWT_SECRET:jobhuntbuddy_jwt_secret_key_256bits_must_be_at_least_32_chars_long_2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${SERVER_PORT:8080}
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Optional: enables "Sign in with Google" on Auto Track / Connections (OAuth client from Google Cloud Console)
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

# Optional absolute path to gmail.yaml (set if auto-detect fails)
coral.gmail.source.file=${CORAL_GMAIL_SOURCE_FILE:}

# Optional absolute path to google_drive.yaml (set if auto-detect fails)
coral.google-drive.source.file=${CORAL_GOOGLE_DRIVE_SOURCE_FILE:}

# Optional absolute path to jobhuntbuddy.yaml (set if auto-detect fails)
coral.jobhuntbuddy.source.file=${CORAL_JOBHUNTBUDDY_SOURCE_FILE:}
